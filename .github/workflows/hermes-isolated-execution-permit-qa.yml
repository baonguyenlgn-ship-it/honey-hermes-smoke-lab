name: Hermes isolated execution-permit contract Windows QA
on:
  push:
    branches: [hermes-lab/honey-isolated-gateway-diagnostics-20261031]
    paths:
      - hermes_lab_local/test_unapproved_execution_boundary.py
      - hermes_lab_local/live_execution_gate.py
      - .github/workflows/hermes-isolated-execution-permit-qa.yml

permissions:
  contents: read

jobs:
  verify-no-launch-without-execute-permission:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact isolated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Only new explicit permission checks, no provider or host keys
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw "HEAD_MISMATCH" }
          if ($env:GITHUB_REF -ne 'refs/heads/hermes-lab/honey-isolated-gateway-diagnostics-20261031') { throw "WRONG_BRANCH" }
          python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest hermes_lab_local.test_unapproved_execution_boundary -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "HERMES_EXECUTION_CONTRACT_DENIES_UNAPPROVED_MODEL_LAUNCH"
