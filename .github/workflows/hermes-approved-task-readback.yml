name: Hermes LAB real GitHub owner-task queue Windows readback
on:
  push:
    branches: [hermes-lab/actions-publisher-20261029-01]
    paths:
      - hermes_lab_local/approved_task_discovery.py
      - hermes_lab_local/test_approved_task_discovery.py
      - .github/workflows/hermes-approved-task-readback.yml

permissions:
  contents: read

jobs:
  approved-mission-discovery-readonly:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - name: Checkout immutable code with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Source parser 15/15 PASS is preserved from 41190125698; this
      # corrective run retries ONLY the failed real GitHub readback.
      - name: Diagnose actual public PR queue response (no model, no token)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw "WRONG_HEAD" }
          @'
          import json
          from hermes_lab_local.approved_task_discovery import read_only_live_discovery
          output=read_only_live_discovery()
          print(json.dumps(output,sort_keys=True),flush=True)
          assert output["execution_authority_granted"] is False
          assert output["model_started"] is False
          assert output["ledger_claimed"] is False
          assert output["status"] not in (
              "STOP_GITHUB_READBACK_UNAVAILABLE", "STOP_PR_IDENTITY_NOT_VERIFIED",
              "STOP_INVALID_REMOTE_HEAD", "STOP_INCOMPLETE_OR_UNTRUSTED_COMMENT_PAGE",
              "STOP_INVALID_OWNER_MISSION", "STOP_UNTRUSTED_COMMENT")
          print("HERMES_OWNER_QUEUE_REAL_GITHUB_READBACK_NO_ADMISSION_NO_MODEL")
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
