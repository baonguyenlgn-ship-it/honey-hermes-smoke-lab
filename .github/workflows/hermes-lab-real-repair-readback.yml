name: Hermes LAB real repair artifact Windows readback

on:
  push:
    branches:
      - hermes-lab/actions-publisher-20261029-01
    paths:
      - hermes_lab_local/repair_generated/**

permissions:
  contents: read

jobs:
  real-hermes-lab-file-independent-sha:
    runs-on: windows-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify HEAD without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify original bytes and explicitly unauthorized scope
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw "HEAD_SHA_MISMATCH" }
          python -m unittest hermes_lab_local.test_repair_generated -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "HERMES_REAL_ARTIFACT_WINDOWS_SHA_PASS_NOT_PROVIDER_SIGNED_OR_FULL_AUTOREPAIR"
