name: Hermes D only safe semantic QA independent Windows acceptance
on:
  push:
    branches: [hermes-lab/honey-isolated-gateway-diagnostics-20261031]
    paths:
      - hermes_lab_local/low_stock_semantic_qa.py
      - hermes_lab_local/test_low_stock_semantic_qa.py
      - .github/workflows/hermes-next-task-semantic-qa.yml
permissions:
  contents: read
jobs:
  hermes-D-pure-python-allowlist-no-inference:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - name: Read exact isolated LAB commit, no persist auth
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Only new D behavior and AST security tests
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw "HEAD_MISMATCH" }
          if ($env:GITHUB_REF -ne 'refs/heads/hermes-lab/honey-isolated-gateway-diagnostics-20261031') { throw "BRANCH_MISMATCH" }
          python -B -m unittest hermes_lab_local.test_low_stock_semantic_qa -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "HERMES_D_SEMANTIC_AST_SECURITY_NEW_WINDOWS_PASS_SOURCE_ONLY"
