name: Hermes E3 only signed worker callback contract Windows QA
on:
  push:
    branches: [hermes-lab/e3-owner-command-review-20261101]
    paths:
      - hermes_lab_local/e3_signed_callback_gate.py
      - hermes_lab_local/test_e3_signed_callback_gate.py
      - .github/workflows/hermes-e3-signed-callback-qa.yml
permissions:
  contents: read
jobs:
  e3-signed-callback-source-contract:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - name: Read exact E3 branch without credentials persisted
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Only new callback source contract, no previous PASS suites or host secrets
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw "E3_WRONG_SOURCE_HEAD" }
          if ($env:GITHUB_REF -ne 'refs/heads/hermes-lab/e3-owner-command-review-20261101') { throw "E3_WRONG_BRANCH" }
          python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest hermes_lab_local.test_e3_signed_callback_gate -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "HERMES_E3_SIGNED_CALLBACK_SOURCE_QA_ONLY_NO_HOST_SIGNATURE_OR_CALLBACK_DELIVERY"
