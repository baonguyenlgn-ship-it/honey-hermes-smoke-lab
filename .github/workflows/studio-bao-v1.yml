name: Honey Studio Bảo V1 — Windows Preview QA
on:
  pull_request:
    branches: [main]
    paths:
      - "studio_bao_v1/**"
      - ".github/workflows/studio-bao-v1.yml"
permissions:
  contents: read
jobs:
  studio-windows-qa:
    # Existing Studio E2E is verified at 40957510094; source-fingerprint only.
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact studio PR head without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check exact SHA and built-in Node runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne "${{ github.event.pull_request.head.sha }}") { throw 'STUDIO_SHA_MISMATCH' }
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check studio_bao_v1/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run offline studio behavior and no-network boundary tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --test studio_bao_v1/tests/studio_smoke.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check studio_bao_v1/voice/voice_candidate_gate.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test studio_bao_v1/tests/voice_candidate_gate.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node studio_bao_v1/voice/voice_candidate_gate.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check studio_bao_v1/voice/supertonic3_preflight_gate.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test studio_bao_v1/tests/supertonic3_preflight.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node studio_bao_v1/voice/supertonic3_preflight_gate.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "STUDIO_WINDOWS_QA_PASS"
      - name: Real Windows Chrome desktop/mobile E2E and screenshots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check studio_bao_v1/tests/browser_e2e.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node studio_bao_v1/tests/browser_e2e.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload DEV-only desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-bao-v1-windows-browser-screenshots
          path: ${{ runner.temp }}/honey-studio-bao-v1/*.png
          if-no-files-found: ignore
          retention-days: 2

  windows-offline-tts-capability-probe:
    # Previous English/VI feasibility proof is recorded in checkpoint; skip unrelated KO-only commits.
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact Studio PR head with read-only job token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: SAPI speech voice inventory and bounded offline sample
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne "${{ github.event.pull_request.head.sha }}") { throw 'PROBE_HEAD_SHA_MISMATCH' }
          & ./studio_bao_v1/tests/offline_tts_probe.ps1 -OutputDir "${{ runner.temp }}/studio-bao-tts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify source WAV bytes, waveform and fail-closed voice availability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check studio_bao_v1/tests/offline_tts_check.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node studio_bao_v1/tests/offline_tts_check.js "${{ runner.temp }}/studio-bao-tts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independent offline Windows dictation feasibility probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./studio_bao_v1/tests/offline_asr_probe.ps1 -OutputDir "${{ runner.temp }}/studio-bao-tts"
          if (-not (Test-Path -LiteralPath "${{ runner.temp }}/studio-bao-tts/offline-asr-probe.json")) { throw 'ASR_PROBE_REPORT_MISSING' }
          node --check studio_bao_v1/tests/offline_asr_check.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node studio_bao_v1/tests/offline_asr_check.js "${{ runner.temp }}/studio-bao-tts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish metadata-only capability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-bao-v1-offline-tts-capability-report
          path: ${{ runner.temp }}/studio-bao-tts/*-probe.json
          if-no-files-found: ignore
          retention-days: 2

  windows-vi-offline-synthesis-research:
    # Previous English/VI feasibility proof is recorded in checkpoint; skip unrelated KO-only commits.
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - name: Checkout exact Studio SHA with read-only token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pinned SHA256 of all three assets before any offline synthesis
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -ne "${{ github.event.pull_request.head.sha }}"){throw 'VI_RESEARCH_SHA_MISMATCH'}
          & ./studio_bao_v1/voice/vi_synthesis_probe.ps1 -OutputDir "${{ runner.temp }}/studio-bao-vi-speech"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Independent WAV bytes, audio activity and commercial-boundary QA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check studio_bao_v1/voice/vi_wav_check.js
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node studio_bao_v1/voice/vi_wav_check.js "${{ runner.temp }}/studio-bao-vi-speech"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Remove-Item -LiteralPath "${{ runner.temp }}/studio-bao-vi-speech/vi-research-speech.wav" -Force
      - name: Upload report ONLY — no model, runtime, WAV or likeness
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-bao-vi-offline-synthesis-research-report
          path: ${{ runner.temp }}/studio-bao-vi-speech/vi-synthesis-probe.json
          if-no-files-found: error
          retention-days: 2

  windows-ko-offline-synthesis-research:
    # Previously successful Korean WAV run 40955324169; freeze until substantive KO TTS delta.
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - name: Checkout exact Studio SHA with read-only token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Hash-pinned official eSpeak NG Windows package and isolated Korean demo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if((git rev-parse HEAD).Trim() -ne "${{ github.event.pull_request.head.sha }}"){throw 'KO_RESEARCH_SHA_MISMATCH'}
          & ./studio_bao_v1/voice/ko_synthesis_probe.ps1 -OutputDir "${{ runner.temp }}/studio-bao-ko-speech"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Verify Korean WAV via independent Node byte-level checks and delete WAV
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check studio_bao_v1/voice/ko_wav_check.js
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node studio_bao_v1/voice/ko_wav_check.js "${{ runner.temp }}/studio-bao-ko-speech"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Remove-Item -LiteralPath "${{ runner.temp }}/studio-bao-ko-speech/ko-research-speech.wav" -Force
      - name: Upload only metadata, never installer, WAV or executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-bao-ko-offline-research-report
          path: ${{ runner.temp }}/studio-bao-ko-speech/ko-offline-synthesis-probe.json
          if-no-files-found: error
          retention-days: 2

  supertonic3-onxx-fingerprint:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'studio-bao-v1/') }}
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Read-only exact SHA checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Stage four pinned ONNX files, SHA256 compare and discard
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -ne "${{ github.event.pull_request.head.sha }}"){throw 'HEAD_MISMATCH'}
          ./studio_bao_v1/voice/supertonic3_hash_only.ps1 -Out "${{ runner.temp }}/honey-st3"
      - name: Upload JSON fingerprint only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honey-supertonic3-onxx-fingerprint
          path: ${{ runner.temp }}/honey-st3/st3-hashes.json
          if-no-files-found: warn
          retention-days: 2
