name: Hermes D only next-task Python envelope acceptance
on:
  push:
    branches: [hermes-lab/honey-isolated-gateway-diagnostics-20261031]
    paths:
      - hermes_lab_local/test_next_task_code_envelope.py
      - hermes_lab_local/strict_model_code_envelope.py
      - .github/workflows/hermes-next-task-envelope-only.yml

permissions:
  contents: read
jobs:
  hermes-next-D-only-source-acceptance:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - name: Pin nonshared branch HEAD, no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run ONLY new D envelope tests, not sealed A/B/C
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'WRONG_HEAD' }
          if ($env:GITHUB_REF -ne 'refs/heads/hermes-lab/honey-isolated-gateway-diagnostics-20261031') { throw 'WRONG_BRANCH' }
          python -B -m unittest hermes_lab_local.test_next_task_code_envelope -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "HERMES_NEXT_D_ENVELOPE_INDEPENDENT_SOURCE_QA_PASS_NOT_MODEL_E2E"
