name: Hermes V3.1 readonly integration Windows QA
on:
  push:
    branches: [hermes-lab/actions-publisher-20261029-01]
    paths: ['hermes_lab_local/v31/**', '.github/workflows/hermes-v31-integration-readback.yml']
permissions:
  contents: read
jobs:
  actual-contract-no-live-authority:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m hermes_lab_local.v31.check_readonly_integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
