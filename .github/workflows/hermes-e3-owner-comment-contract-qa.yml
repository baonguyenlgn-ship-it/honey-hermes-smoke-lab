name: Hermes E3 Owner comment admission independent Windows QA only
on:
  push:
    branches: [hermes-lab/e3-owner-command-review-20261101]
    paths:
      - hermes_lab_local/e3_owner_comment_admission.py
      - hermes_lab_local/test_e3_owner_comment_admission.py
      - .github/workflows/hermes-e3-owner-comment-contract-qa.yml
permissions:
  contents: read
jobs:
  new-E3-source-only-owner-admission:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact E3 PR source without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Strict E3 new Owner origin, current HEAD, no privilege tests
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw "E3_SOURCE_SHA_MISMATCH" }
          if ($env:GITHUB_REF -ne 'refs/heads/hermes-lab/e3-owner-command-review-20261101') { throw "E3_WRONG_BRANCH" }
          python -B -m unittest hermes_lab_local.test_e3_owner_comment_admission -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "HERMES_E3_SOURCE_ONLY_OWNER_COMMENT_CONTRACT_PASS_NOT_DEFAULT_BRANCH_NOT_LIVE"
