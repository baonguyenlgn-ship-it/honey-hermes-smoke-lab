name: Hermes E1 exact permanent archive Windows SHA readback
on:
  push:
    branches: [hermes-lab/e1-durable-evidence-20261101]
    paths:
      - hermes_lab_evidence/E1-stock-gap-run-41220878044/**
      - .github/workflows/hermes-e1-permanent-archive-readback.yml
permissions:
  contents: read
jobs:
  archive-only-independent-windows:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact archive source SHA with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify archived model bytes, provenance and original real workflow
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw "ARCHIVE_SHA_MISMATCH" }
          if ($env:GITHUB_REF -ne 'refs/heads/hermes-lab/e1-durable-evidence-20261101') { throw "ARCHIVE_WRONG_BRANCH" }
          @'
          import hashlib, json, urllib.request
          from pathlib import Path
          from hermes_lab_local.e1_durable_new_task import qa_new_e1_task
          from hermes_lab_local.windows_local_hermes_coding import PINNED_HERMES
          folder=Path('hermes_lab_evidence/E1-stock-gap-run-41220878044')
          p=json.loads((folder/'provenance.json').read_text(encoding='utf8'))
          expected='d1e52c92ff1954bcce3a03d1b4d5c0dab66151314aaf23290468bf47e53a1687'
          if (p.get('schema') != 'honey.hermes.e1.permanent-model-source-seal.v1'
              or p.get('original_source_sha256') != expected
              or p.get('original_source_bytes') != 75
              or p.get('task_id') != 'HERMES-E1-STOCK-GAP-DURABLE-01'
              or p.get('hermes_upstream_sha') != PINNED_HERMES
              or p.get('source_workflow_run_id') != 41220878044
              or p.get('source_workflow_head') != '7f39e887591b6293514d0aea9022c904a5af587a'
              or p.get('producer_job_id') != 124594974925
              or p.get('independent_download_qa_job_id') != 124595718487
              or p.get('model_attempts') != 2 or p.get('model_repairs') != 1
              or p.get('artifact_id') != 13049898229
              or p.get('scope',{}).get('signed_gate_b') is not False
              or p.get('scope',{}).get('automatic_callback_verified') is not False
              or p.get('branch') != 'hermes-lab/e1-durable-evidence-20261101'):
              raise SystemExit('E1_ARCHIVE_PROVENANCE_NOT_VERIFIED')
          raw=(folder/'original_model_generated.py').read_bytes()
          if len(raw)!=75 or hashlib.sha256(raw).hexdigest()!=expected:
              raise SystemExit('E1_ORIGINAL_MODEL_BYTES_HASH_MISMATCH')
          if qa_new_e1_task(raw.decode('utf-8','strict')) != raw:
              raise SystemExit('E1_ORIGINAL_SOURCE_BEHAVIOR_FAILED')
          url='https://api.github.com/repos/baonguyenlgn-ship-it/honey-hermes-smoke-lab/actions/runs/41220878044'
          req=urllib.request.Request(url,headers={'User-Agent':'honey-e1-repo-archive-independent-qa',
                                                  'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=12) as response:
              if response.status != 200 or response.geturl() != url:
                  raise SystemExit('E1_SOURCE_RUN_REMOTE_UNTRUSTED')
              payload=response.read(65537)
          if len(payload)>65536: raise SystemExit('E1_SOURCE_RUN_REMOTE_OVERSIZE')
          run=json.loads(payload)
          if (run.get('id')!=41220878044 or run.get('head_sha')!=p['source_workflow_head']
              or run.get('conclusion')!='success' or run.get('status')!='completed'):
              raise SystemExit('E1_SOURCE_RUN_NOT_VERIFIED')
          print('HERMES_E1_PERMANENT_GIT_ARCHIVED_REAL_MODEL_SOURCE_INDEPENDENT_READBACK_PASS')
          print('E1_ORIGINAL_SHA256='+expected)
          print('E1_ARCHIVED_BYTES=75')
          print('E1_SIGNED_GATE_B=False AUTO_WAKE=False')
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
