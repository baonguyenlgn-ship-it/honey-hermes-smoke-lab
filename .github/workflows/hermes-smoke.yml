name: Hermes LAB QA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "hermes_worker_lab/**"
      - ".github/workflows/hermes-smoke.yml"
permissions:
  contents: read
jobs:
  hermes-contract-qa:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'hermes-lab/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run isolated worker contract QA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 -m unittest discover -s hermes_worker_lab -t . -v
          python3 -m py_compile hermes_worker_lab/worker_admission.py hermes_worker_lab/tests/test_worker_admission.py
  hermes-cli-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'hermes-lab/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install pinned Hermes dev environment and verify CLI
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="bf0203a794a07aac3ff764972ab9087baa4e4f4e"
          source_dir="$RUNNER_TEMP/hermes-agent"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$source_dir" fetch --depth 1 origin v0.22.5
          git -C "$source_dir" checkout --detach FETCH_HEAD
          actual_sha="$(git -C "$source_dir" rev-parse HEAD)"
          test "$actual_sha" = "$expected_sha"
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          export HERMES_RUNTIME_DIR="$RUNNER_TEMP/hermes-runtime"
          mkdir -p "$HERMES_HOME" "$HERMES_RUNTIME_DIR"
          unset GITHUB_TOKEN GH_TOKEN
          cd "$source_dir"
          source ./activate
          hermes --help
          echo "Hermes CLI smoke: PASS"
          echo "upstream_commit=$actual_sha"
          deactivate
